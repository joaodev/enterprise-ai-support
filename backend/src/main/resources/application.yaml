spring:
  application:
    name: ai-support-api

  ai:
    model:
      chat: none

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

---
spring:
  config:
    activate:
      on-profile: ollama

  ai:
    model:
      chat: ollama

    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        temperature: 0.1
        model: ${OLLAMA_MODEL:qwen3:4b-instruct}